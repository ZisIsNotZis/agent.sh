<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" width="200" height="40" role="img" aria-label="agent.sh">
  <title>agent.sh</title>
  <style>
    svg { color: #1f2328; }
    @media (prefers-color-scheme: dark) { svg { color: #e6edf3; } }
    .wordmark {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
      fill: currentColor;
    }
  </style>
  <!-- the harness: one shell that owns another -->
  <rect x="3" y="7" width="32" height="26" rx="6" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- the hands: a prompt, and a cursor where the block's output will land -->
  <path d="M11 15 L18 20 L11 25" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="21" y="23" width="6" height="2" rx="1" fill="currentColor"/>
  <text class="wordmark" x="44" y="26">agent.sh</text>
</svg>
